name: Publish CLI release
run-name: Publish Codag v${{ inputs.version || github.event.client_payload.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable source version without the leading v
        required: true
        type: string
      source_sha:
        description: Full commit SHA resolved by the private release workflow
        required: true
        type: string
  repository_dispatch:
    types: [publish-cli-release]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.event.client_payload.version }}
      SOURCE_SHA: ${{ inputs.source_sha || github.event.client_payload.source_sha }}
    steps:
      - name: Check out release repository
        uses: actions/checkout@v6

      - name: Validate immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Invalid stable release version: $VERSION" >&2
            exit 1
          fi
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid full source SHA: $SOURCE_SHA" >&2
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Public release v$VERSION already exists and will not be overwritten." >&2
            exit 1
          fi

      - name: Mint private-source token
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CODAG_RELEASE_APP_ID }}
          private-key: ${{ secrets.CODAG_RELEASE_APP_PRIVATE_KEY }}
          owner: codag-megalith
          repositories: codag-cli
          permission-contents: read

      - name: Check out exact private source tag
        uses: actions/checkout@v6
        with:
          repository: codag-megalith/codag-cli
          ref: v${{ env.VERSION }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Verify private source identity
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-list -n 1 "v$VERSION")" = "$SOURCE_SHA"
          test "$(git describe --tags --exact-match)" = "v$VERSION"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Verify source
        working-directory: source
        run: |
          go vet ./...
          go test ./...

      - name: Build canonical release archives
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          distribution: goreleaser
          workdir: source
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}

      - name: Assemble public release
        run: |
          set -euo pipefail
          mkdir -p dist
          cp source/dist/codag_*.tar.gz source/dist/codag_*.zip dist/
          cp install.sh install.ps1 dist/
          chmod +x dist/install.sh
          jq -n \
            --arg version "$VERSION" \
            --arg source_repository "codag-megalith/codag-cli" \
            --arg source_tag "v$VERSION" \
            --arg source_sha "$SOURCE_SHA" \
            --arg release_repository "$GITHUB_REPOSITORY" \
            --arg release_workflow_sha "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            '{schema_version:1,version:$version,source_repository:$source_repository,source_tag:$source_tag,source_sha:$source_sha,release_repository:$release_repository,release_workflow_sha:$release_workflow_sha,workflow_run_id:$workflow_run_id}' \
            > dist/provenance.json
          (cd dist && sha256sum codag_* install.sh install.ps1 provenance.json | sort -k2 > checksums.txt)

      - name: Attest public artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/codag_*.tar.gz
            dist/codag_*.zip
            dist/checksums.txt
            dist/install.sh
            dist/install.ps1
            dist/provenance.json

      - name: Publish immutable public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_created=0
          cleanup_unpublished_release() {
            if [ "$release_created" -eq 1 ]; then
              is_draft="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
              if [ "$is_draft" = "true" ]; then
                gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              fi
            fi
          }
          trap cleanup_unpublished_release EXIT
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Codag v$VERSION" \
            --notes "Compiled from private source tag v$VERSION ($SOURCE_SHA). See provenance.json and GitHub build attestations." \
            --draft
          release_created=1
          gh release upload "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          release_created=0
          trap - EXIT

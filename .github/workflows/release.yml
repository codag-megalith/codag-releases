name: Publish CLI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Source tag version without the leading v
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repository
        uses: actions/checkout@v6

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

      - name: Check out private source tag
        uses: actions/checkout@v6
        with:
          repository: codag-megalith/codag-cli
          ref: v${{ inputs.version }}
          ssh-key: ${{ secrets.CODAG_CLI_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Verify source
        working-directory: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git describe --tags --exact-match)" = "v$VERSION"
          go vet ./...
          go test ./...

      - name: Build release archives
        working-directory: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dist_dir="$GITHUB_WORKSPACE/dist"
          build_dir="$GITHUB_WORKSPACE/build"
          mkdir -p "$dist_dir" "$build_dir"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            target_dir="$build_dir/${os}_${arch}"
            mkdir -p "$target_dir"
            binary="codag"
            if [ "$os" = windows ]; then binary="codag.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/codag-megalith/codag-cli/cmd.Version=$VERSION -X github.com/codag-megalith/codag-cli/cmd.Commit=$commit -X github.com/codag-megalith/codag-cli/cmd.BuildDate=$build_date" \
              -o "$target_dir/$binary" .
            if [ "$os" = windows ]; then
              (cd "$target_dir" && zip -q "$dist_dir/codag_${os}_${arch}.zip" "$binary")
            else
              tar -C "$target_dir" -czf "$dist_dir/codag_${os}_${arch}.tar.gz" "$binary"
            fi
          done
          cp install.sh install.ps1 "$dist_dir/"
          chmod +x "$dist_dir/install.sh"
          (cd "$dist_dir" && sha256sum codag_* > checksums.txt)

      - name: Attest release archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/codag_*.tar.gz
            dist/codag_*.zip

      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          source_commit="$(git -C source rev-parse HEAD)"
          gh release create "v$VERSION" \
            dist/checksums.txt dist/codag_* dist/install.sh dist/install.ps1 \
            --repo codag-megalith/codag-releases \
            --target "$GITHUB_SHA" \
            --title "Codag v$VERSION" \
            --notes "Compiled from private source tag v$VERSION ($source_commit)."
